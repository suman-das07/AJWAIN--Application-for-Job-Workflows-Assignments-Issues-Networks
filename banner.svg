<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="AJWAIN – From Issues to Outcomes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .title{font:800 92px 'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:10px;fill:url(#ink)}
      .sub{font:400 20px 'Space Mono',ui-monospace,Menlo,Consolas,monospace;fill:#cbd5e1;letter-spacing:1px}
      .tag{font:700 14px 'Space Mono',ui-monospace,Menlo,Consolas,monospace;fill:#94a3b8;letter-spacing:4px}
      .fade{animation:fade 1.2s ease-out both}
      .fade2{animation:fade 1.2s .4s ease-out both}
      .fade3{animation:fade 1.2s .8s ease-out both}
      @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .float{animation:float 6s ease-in-out infinite}
      @keyframes float{50%{transform:translateY(-10px)}}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes pulse{50%{opacity:.35;transform:scale(1.5)}}
      .dash{stroke-dasharray:6 8;animation:dash 3s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-56}}
    </style>
  </defs>
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>

  <!-- workflow motif: Open -> In Progress -> Done -->
  <g class="float" opacity="0.9">
    <path class="dash" d="M690 70 H770 M840 70 H900" stroke="#475569" stroke-width="2" fill="none"/>
    <circle class="pulse" cx="670" cy="70" r="9" fill="#f87171"/>
    <circle class="pulse" cx="805" cy="70" r="9" fill="#fbbf24" style="animation-delay:.6s"/>
    <circle class="pulse" cx="920" cy="70" r="9" fill="#34d399" style="animation-delay:1.2s"/>
  </g>

  <text class="tag fade" x="70" y="95">ISSUE TRACKING ENGINE</text>
  <text class="title fade2" x="66" y="190">AJWAIN</text>
  <text class="sub fade3" x="70" y="240">From Issues to Outcomes.</text>
</svg>
